name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g., 0.2.3, 0.3.0, 1.0.0)"
        required: true
        type: string

env:
  FORCE_COLOR: "0"
  NO_COLOR: "1"
  TERRADB_TEST_SILENT: "1"

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      mutation_base_ref: "${{ github.sha }}^"

  nightly:
    uses: ./.github/workflows/nightly.yml

  release:
    needs: [ci, nightly]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - run: bun install
      - run: bun run build
      - run: npm pack --dry-run
      - run: npm version ${{ github.event.inputs.version }} --no-git-tag-version
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - run: |
          git add package.json
          git commit -m "chore(release): bump to v${{ github.event.inputs.version }}"
      - run: git tag v${{ github.event.inputs.version }}
      - run: |
          git push origin main
          git push origin v${{ github.event.inputs.version }}
      - run: npm publish --provenance --access public
      - name: Create GitHub Release
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ github.event.inputs.version }}';
            const { data: tags } = await github.rest.repos.listTags({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 10
            });
            const currentTag = `v${version}`;
            const previousTag = tags.find((t) => t.name !== currentTag)?.name;
            let body = "";
            if (previousTag) {
              body = `Full Changelog: https://github.com/${context.repo.owner}/${context.repo.repo}/compare/${previousTag}...${currentTag}`;
            } else {
              body = "First tagged release.";
            }
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: currentTag,
              name: currentTag,
              body
            });
