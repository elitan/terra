name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_USER: test_user
          POSTGRES_DB: sql_terraform_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5487:5432

      postgres-pgvector:
        image: pgvector/pgvector:0.8.1-pg17
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_USER: test_user
          POSTGRES_DB: sql_terraform_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5488:5432

      postgres-postgis:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_USER: test_user
          POSTGRES_DB: sql_terraform_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5489:5432

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Bun
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: latest
    
    - name: Install dependencies
      run: bun install
    
    - name: Wait for PostgreSQL services
      run: |
        for port in 5487 5488 5489; do
          ready=0
          for i in {1..30}; do
            if pg_isready -h localhost -p $port -U test_user; then
              echo "PostgreSQL on port $port is ready"
              ready=1
              break
            fi
            echo "Waiting for PostgreSQL on port $port... ($i/30)"
            sleep 2
          done
          if [ $ready -ne 1 ]; then
            echo "PostgreSQL on port $port did not become ready"
            exit 1
          fi
        done

    - name: Run tests with coverage gate
      run: bun run test:coverage
      env:
        DATABASE_URL: postgres://test_user:test_password@localhost:5487/sql_terraform_test
    
    - name: Build
      run: bun run build

  property-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_USER: test_user
          POSTGRES_DB: sql_terraform_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5487:5432

    steps:
    - uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: latest

    - name: Install dependencies
      run: bun install

    - name: Wait for PostgreSQL
      run: |
        ready=0
        for i in {1..30}; do
          if pg_isready -h localhost -p 5487 -U test_user; then
            echo "PostgreSQL is ready"
            ready=1
            break
          fi
          echo "Waiting for PostgreSQL... ($i/30)"
          sleep 2
        done
        if [ $ready -ne 1 ]; then
          echo "PostgreSQL did not become ready"
          exit 1
        fi

    - name: Run property tests
      run: bun run test:properties
      env:
        DATABASE_URL: postgres://test_user:test_password@localhost:5487/sql_terraform_test
        FC_SEED: "20260218"

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Bun
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: latest
    
    - name: Install dependencies
      run: bun install
    
    - name: Check TypeScript
      run: bunx tsc --noEmit
