name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_COLOR: "0"
  NO_COLOR: "1"
  TERRADB_TEST_SILENT: "1"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bunx tsc --noEmit

  test-unit:
    name: test:unit
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_USER: test_user
          POSTGRES_DB: sql_terraform_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: cp .env.example .env
      - run: bun install
      - run: bun run test:unit
        env:
          DATABASE_URL: postgres://test_user:test_password@localhost:5432/sql_terraform_test

  test-sqlite:
    name: test:sqlite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: cp .env.example .env
      - run: bun install
      - run: bun run test:sqlite

  test-pg14:
    name: test:pg:14
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_USER: test_user
          POSTGRES_DB: sql_terraform_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: cp .env.example .env
      - run: bun install
      - run: bun run test:pg:14
        env:
          DATABASE_URL_PG14: postgres://test_user:test_password@localhost:5432/sql_terraform_test

  test-pg18:
    name: test:pg:18
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_USER: test_user
          POSTGRES_DB: sql_terraform_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: cp .env.example .env
      - run: bun install
      - run: bun run test:pg:18
        env:
          DATABASE_URL_PG18: postgres://test_user:test_password@localhost:5432/sql_terraform_test

  test-pg-extensions:
    name: test:pg:extensions
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres-pgvector:
        image: pgvector/pgvector:0.8.1-pg17
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_USER: test_user
          POSTGRES_DB: sql_terraform_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5488:5432
      postgres-postgis:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_USER: test_user
          POSTGRES_DB: sql_terraform_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5489:5432
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: cp .env.example .env
      - run: bun install
      - run: bun run test:pg:extensions

  test-e2e:
    name: test:e2e
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: cp .env.example .env
      - run: bun install
      - run: bun run test:e2e

  test-property-pr:
    name: test:property:pr
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_USER: test_user
          POSTGRES_DB: sql_terraform_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: cp .env.example .env
      - run: bun install
      - run: bun run test:property:pr
        env:
          FC_SEED: "20260218"
          DATABASE_URL: postgres://test_user:test_password@localhost:5432/sql_terraform_test

  test-flake:
    name: test:flake
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_USER: test_user
          POSTGRES_DB: sql_terraform_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: cp .env.example .env
      - run: bun install
      - run: bun run test:flake
        env:
          DATABASE_URL: postgres://test_user:test_password@localhost:5432/sql_terraform_test

  test-mutation-changed:
    name: test:mutation:changed
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_USER: test_user
          POSTGRES_DB: sql_terraform_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: cp .env.example .env
      - run: bun install
      - run: bun run test:mutation:changed:gate
        env:
          DATABASE_URL: postgres://test_user:test_password@localhost:5432/sql_terraform_test
          DATABASE_URL_PG14: ""
          DATABASE_URL_PG15: ""
          DATABASE_URL_PG16: ""
          DATABASE_URL_PG17: postgres://test_user:test_password@localhost:5432/sql_terraform_test
          MUTATION_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
          MUTATION_HEAD_REF: ${{ github.sha }}
          MUTATION_MAX_MUTANTS_PER_FILE: "4"
          MUTATION_TIMEOUT_MS: "90000"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-reports
          path: coverage/mutation/

  coverage-build:
    name: coverage gate + build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_USER: test_user
          POSTGRES_DB: sql_terraform_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5487:5432
      postgres-pgvector:
        image: pgvector/pgvector:0.8.1-pg17
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_USER: test_user
          POSTGRES_DB: sql_terraform_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5488:5432
      postgres-postgis:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_USER: test_user
          POSTGRES_DB: sql_terraform_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5489:5432
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: cp .env.example .env
      - run: bun install
      - run: bun run test:doctor
      - run: bun run test:coverage
        env:
          DATABASE_URL: postgres://test_user:test_password@localhost:5487/sql_terraform_test
      - run: bun run build
